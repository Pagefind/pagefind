name: Word Stemming > The backtrack floor is configurable
steps:
  - ref: ./background.toolproof.yml
  - step: I have a "public/doc/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><p>a doc about
      installation</p></body></html>
  - macro: I run Pagefind
  - step: stdout should contain "Running Pagefind"
  - step: I serve the directory "public"
  - step: In my browser, I load "/"
  - step: In my browser, the result of {js} should be exactly {expected}
    js: |-
      let pagefind = await import("/pagefind/pagefind.js");
      await pagefind.options({ backtrackFloor: 0 });
      let unbounded = await pagefind.search("aubergine");
      await pagefind.options({ backtrackFloor: 7 });
      let raised = await pagefind.search("documentation");
      return [unbounded.results.length, raised.results.length];
    expected:
      - 1
      - 0

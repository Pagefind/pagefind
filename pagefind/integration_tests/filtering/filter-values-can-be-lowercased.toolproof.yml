name: Filtering > Filter values can be lowercased
steps:
  - step: I have the environment variable "PAGEFIND_SITE" set to "public"
  - step: I have a "public/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><p
      data-results>Nothing</p></body></html>
  - step: I have a "public/cheeka/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><span
      data-pagefind-filter="color">Black</span>

      <span data-pagefind-filter="color">White</span>

      <span data-pagefind-filter="color">white</span>

      <h1>Cat</h1></body></html>
  - step: I have a "public/theodore/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><span
      data-pagefind-filter="color">WHITE</span>

      <h1>Cat</h1></body></html>
  - macro: I run Pagefind with "--lowercase-filters"
  - step: stdout should contain "Running Pagefind"
  - step: I serve the directory "public"
  - step: In my browser, I load "/"
  - step: In my browser, I evaluate {js}
    js: |-
      let pagefind = await import("/pagefind/pagefind.js");

      let filters = await pagefind.filters();
      let strings = Object.entries(filters).map(([filter, values]) => {
          values = Object.entries(values).map(([value, count]) => {
              return `${value}(${count})`;
          })
          return `${filter}:[${values.join(", ")}]`;
      });

      let search = await pagefind.search("Cat", { filters: { color: "white" } });
      let data = await Promise.all(search.results.map(result => result.data()));

      document.querySelector('[data-results]').innerText = strings.join(' ')
          + ' ' + data.map(d => d.url).sort().join(', ');
  - step: In my browser, the console should be empty
  - step: In my browser, I evaluate {js}
    js: >-
      let val = await toolproof.querySelector("[data-results]");

      toolproof.assert_eq(val.innerHTML, `color:[black(1), white(2)]
      /cheeka/, /theodore/`);

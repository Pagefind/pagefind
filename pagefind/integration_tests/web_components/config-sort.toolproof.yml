name: Web Components Tests > Config sort attribute works
steps:
  - step: I have the environment variable "PAGEFIND_SITE" set to "public"
  - step: I have a "public/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head>
      <link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
      </head><body>
      <pagefind-config preload no-worker sort="date:desc"></pagefind-config>
      <pagefind-input></pagefind-input>
      <pagefind-summary></pagefind-summary>
      <pagefind-results></pagefind-results>
      <script src="/pagefind/pagefind-component-ui.js" type="module"></script>
      </body></html>
  - step: I have a "public/old/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><span
      data-pagefind-sort="date">2020-01-01</span><h1>Cat Page</h1><p>This cat
      page is about cats, cats, and more cats.</p></body></html>
  - step: I have a "public/middling/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><span
      data-pagefind-sort="date">2022-01-01</span><h1>Feline Page</h1><p>This
      page is about a cat.</p></body></html>
  - step: I have a "public/new/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><span
      data-pagefind-sort="date">2024-01-01</span><h1>Kitten Page</h1><p>This
      page is about a cat.</p></body></html>
  - macro: I run Pagefind
  - step: stdout should contain "Running Pagefind"
  - step: I serve the directory "public"
  - step: In my browser, I load "/"
  - step: In my browser, I click the selector "pagefind-input input"
  - step: In my browser, I type "cat"
  - step: In my browser, the console should be empty
  - step: In my browser, I evaluate {js}
    js: |-
      let results = await toolproof.querySelector("pagefind-results ul");
      await toolproof.waitFor(() => {
        let links = results.querySelectorAll("li a");
        return links.length === 3;
      });
  - step: In my browser, I evaluate {js}
    js: |-
      let links = document.querySelectorAll("pagefind-results ul li a");
      let hrefs = [...links].map((link) => link.getAttribute("href"));
      toolproof.assert_eq(hrefs.join(", "), `/new/, /middling/, /old/`);

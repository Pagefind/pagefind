name: Web Components Tests > Modal closes when a same-page result is activated
steps:
  - step: I have the environment variable "PAGEFIND_SITE" set to "public"
  - step: I have a "public/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head>
      <link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
      </head><body>
      <pagefind-config preload></pagefind-config>
      <pagefind-modal-trigger></pagefind-modal-trigger>
      <pagefind-modal></pagefind-modal>
      <h1>Apple Guide</h1>
      <p>Learn about apple varieties.</p>
      <div style="height: 2000px"></div>
      <h2 id="basics">Basic Apple Info</h2>
      <p>This section covers basic apple types.</p>
      <script src="/pagefind/pagefind-component-ui.js" type="module"></script>
      </body></html>
  - macro: I run Pagefind
  - step: stdout should contain "Running Pagefind"
  - step: The file "public/pagefind/pagefind.js" should not be empty
  - step: I serve the directory "public"
  - step: In my browser, I load "/"
  - step: In my browser, I click the selector "pagefind-modal-trigger button"
  - step: In my browser, I evaluate {js}
    js: |-
      let dialog = await toolproof.querySelector("pagefind-modal dialog");
      await toolproof.waitFor(() => dialog.open === true);
  - step: In my browser, I type "apple"
  - step: In my browser, I evaluate {js}
    js: |-
      let results = await toolproof.querySelector("pagefind-modal pagefind-results ul");
      await toolproof.waitFor(() => results.querySelectorAll(".pf-heading-link").length >= 1);
  - step: In my browser, the console should be empty
  # Activating a sub-result on the current page only changes the fragment,
  # so nothing unloads the document and the modal must close itself
  - step: In my browser, I click the selector "pagefind-modal .pf-heading-link"
  - step: In my browser, I evaluate {js}
    js: |-
      let dialog = await toolproof.querySelector("pagefind-modal dialog");
      await toolproof.waitFor(() => dialog.open === false, "Modal should close when a result is activated");
      toolproof.assert(location.hash === "#basics", `Expected the fragment navigation to happen, got "${location.hash}"`);
      toolproof.assert(window.scrollY > 0, `Expected the page to stay scrolled to the fragment, got scrollY ${window.scrollY}`);

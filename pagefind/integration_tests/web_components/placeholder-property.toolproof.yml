name: Web Components Tests > Placeholder can be set as a JS property
steps:
  - step: I have the environment variable "PAGEFIND_SITE" set to "public"
  - step: I have a "public/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head>
      <link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
      </head><body>
      <pagefind-modal-trigger></pagefind-modal-trigger>
      <pagefind-searchbox></pagefind-searchbox>
      <script src="/pagefind/pagefind-component-ui.js" type="module"></script>
      </body></html>
  - step: I have a "public/hello/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head></head><body><h1>Hello World</h1></body></html>
  - macro: I run Pagefind
  - step: I serve the directory "public"
  - step: In my browser, I load "/"
  - step: In my browser, I evaluate {js}
    js: |-
      await toolproof.querySelector(".pf-trigger-text");
      let input = await toolproof.querySelector("pagefind-searchbox input");
      document.querySelector("pagefind-modal-trigger").placeholder = "Chercher";
      document.querySelector("pagefind-searchbox").placeholder = "Rechercher";
      let text = document.querySelector(".pf-trigger-text").textContent;
      toolproof.assert(text === "Chercher", `Trigger text should be Chercher, got ${text}`);
      toolproof.assert(
        input.placeholder === "Rechercher",
        `Searchbox placeholder should be Rechercher, got ${input.placeholder}`
      );

name: Base Tests > Default UI detection warns when UI files are skipped
steps:
  - ref: ./background.toolproof.yml
  - step: I have a "public/index.html" file with the content {html}
    html: >-
      <!DOCTYPE html><html lang="en"><head>
      <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
      <script src="/pagefind/pagefind-ui.js"></script>
      </head><body>
      <p>Hello world</p>
      </body></html>
  - macro: I run Pagefind with "--skip-ui"
  - step: stderr should contain "`skip_ui` is enabled"
  - step: stdout should not contain "Pagefind found references to the Default UI"

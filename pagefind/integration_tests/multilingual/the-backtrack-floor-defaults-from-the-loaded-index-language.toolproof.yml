name: The backtrack floor defaults from the loaded index language
steps:
  - step: I have the environment variable "PAGEFIND_SITE" set to "public"
  # This page is not indexed, so searching from it loads the Japanese index
  # even though the page itself declares English
  - step: I have a "public/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html>
      <html lang="en"><body data-pagefind-ignore><p>Search</p></body></html>
  - step: I have a "public/ja/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html>
      <html lang="ja">
      <body>
          <p>東京 の 人 が 多い</p>
      </body>
      </html>
  - macro: I run Pagefind
  - step: stdout should contain "Running Pagefind"
  - step: I serve the directory "public"
  - step: In my browser, I load "/"
  - step: In my browser, the result of {js} should be exactly {expected}
    js: |-
      let pagefind = await import("/pagefind/pagefind.js");
      // The floor should default from the index we actually loaded (ja), not from
      // the language this page asked for (en)
      let search = await pagefind.search("人々");
      return search.results.length;
    expected: 1

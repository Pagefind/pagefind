name: Index Chunking > Prefix search loads the following chunks that extend the term
steps:
  - ref: ./background.toolproof.yml
  - step: I have the environment variable "PAGEFIND_UNSTABLE_INDEX_CHUNK_SIZE" set to "4"

  # Words: vxyz, wa, wab, wac
  # All going well, this should produce:
  # - Chunk 1: "vxyz" to "wa"
  # - Chunk 2: "wab" to "wac"
  #
  # "wa" falls inside chunk 1's range, but the words extending it ("wab",
  # "wac") are in chunk 2, which must be loaded too.

  - step: I have a "public/vxyz/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head></head><body>
      <p>vxyz</p>
      </body></html>

  - step: I have a "public/wa/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head></head><body>
      <p>wa</p>
      </body></html>

  - step: I have a "public/wab/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head></head><body>
      <p>wab</p>
      </body></html>

  - step: I have a "public/wac/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head></head><body>
      <p>wac</p>
      </body></html>

  - macro: I run Pagefind
  - step: stdout should contain "Running Pagefind"
  - step: The file "public/pagefind/pagefind.js" should not be empty
  - step: I serve the directory "public"
  - step: In my browser, I load "/"

  # Search for "wa" in a fresh session - should match the three pages
  # whose word starts with "wa", not only the one in chunk 1
  - step: In my browser, the result of {js} should be exactly {expected}
    js: |-
      let pagefind = await import("/pagefind/pagefind.js");
      let search = await pagefind.search("wa");
      let pages = await Promise.all(search.results.map(r => r.data()));
      return pages.map(p => p.url).sort();
    expected:
      - /wa/
      - /wab/
      - /wac/

name: Index Chunking > Filter-only searches load no index chunks
steps:
  - ref: ./background.toolproof.yml
  - step: I have the environment variable "PAGEFIND_UNSTABLE_INDEX_CHUNK_SIZE" set to "1"

  - step: I have a "public/cheeka/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head></head><body>
      <span data-pagefind-filter="color">White</span>
      <p>aardvark apple foxtrot zebra</p>
      </body></html>

  - step: I have a "public/theodore/index.html" file with the content {html}
    html: |-
      <!DOCTYPE html><html lang="en"><head></head><body>
      <span data-pagefind-filter="color">Black</span>
      <p>banana kiwi mango pear</p>
      </body></html>

  - macro: I run Pagefind
  - step: I serve the directory "public"
  - step: In my browser, I load "/"

  # Run on the main thread so that the chunk requests land on this timeline
  - step: In my browser, the result of {js} should be exactly {expected}
    js: |-
      let pagefind = await import("/pagefind/pagefind.js");
      await pagefind.options({ noWorker: true });
      await pagefind.init();
      let search = await pagefind.search(null, { filters: { color: "White" } });
      let pages = await Promise.all(search.results.map(r => r.data()));
      return pages.map(p => p.url);
    expected:
      - /cheeka/

  - step: In my browser, the result of {js} should be exactly {expected}
    js: |-
      return performance.getEntriesByType("resource").filter(e => e.name.endsWith(".pf_index")).length;
    expected: 0

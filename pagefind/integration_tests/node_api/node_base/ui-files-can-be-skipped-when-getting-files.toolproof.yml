name: Node API Base Tests > UI files can be skipped when getting files
platforms:
  - linux
  - mac

steps:
  - ref: ./background.toolproof.yml
  - step: I have a "public/index.js" file with the content {js}
    js: |2-
       import * as pagefind from "pagefind";

       const run = async () => {
           const { index } = await pagefind.createIndex({ skipUi: true });
           await index.addHTMLFile({sourcePath: "dogs/index.html", content: "<html><body><h1>Testing, testing</h1></body></html>"});
           const { files } = await index.getFiles();

           console.log(files.map(f => f.path).join(', '));
       }

       run();
  - macro: I run Pagefind Node as "index.js" in "public"
  - step: stdout should contain "pagefind.js"
  - step: stdout should contain "pagefind-highlight.js"
  - step: stdout should not contain "pagefind-ui.js"
  - step: stdout should not contain "pagefind-ui.css"
  - step: stdout should not contain "pagefind-modular-ui.js"
  - step: stdout should not contain "pagefind-modular-ui.css"
  - step: stdout should not contain "pagefind-component-ui.js"
  - step: stdout should not contain "pagefind-component-ui.css"

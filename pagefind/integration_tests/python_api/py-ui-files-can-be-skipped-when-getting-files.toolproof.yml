name: Python API > UI files can be skipped when getting files
platforms:
  - linux
  - mac

steps:
  - ref: ./background.toolproof.yml
  - step: I have a "public/run.py" file with the content {python}
    python: |2-
      import sys
      sys.path.append('%toolproof_process_directory%/wrappers/python/src')

      import asyncio
      import json
      import logging
      import os
      from pagefind.index import PagefindIndex, IndexConfig

      async def main():
        config = IndexConfig(skip_ui=True)

        async with PagefindIndex(config=config) as index:
          await index.add_html_file(
              content="<html><body><h1>Testing, testing</h1></body></html>",
              source_path="dogs/index.html",
          )

          files = await index.get_files()

          for file in files:
            print(file["path"])
      if __name__ == "__main__":
        asyncio.run(main())
  - macro: I run Pagefind Python as "run.py" in "public"
  - step: stdout should contain "pagefind.js"
  - step: stdout should contain "pagefind-highlight.js"
  - step: stdout should not contain "pagefind-ui.js"
  - step: stdout should not contain "pagefind-ui.css"
  - step: stdout should not contain "pagefind-modular-ui.js"
  - step: stdout should not contain "pagefind-modular-ui.css"
  - step: stdout should not contain "pagefind-component-ui.js"
  - step: stdout should not contain "pagefind-component-ui.css"
